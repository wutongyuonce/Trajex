document.addEventListener('keydown',e=>{const input=/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable,key=e.key.length===1?e.key.toLowerCase():e.key,mod=e.metaKey||e.ctrlKey;if(mod&&['1','2','3'].includes(key)){e.preventDefault();key==='1'?A.nav('sessions'):A.memoryView(key==='2'?'active':'archived');return}if(S.page==='sessionDetail'&&mod){const sizes=[12,13,14,15,16,18],i=sizes.indexOf(S.fontSize);if(['=','+'].includes(key)){e.preventDefault();S.fontSize=sizes[Math.min(sizes.length-1,i+1)];renderContent();return}if(key==='-'){e.preventDefault();S.fontSize=sizes[Math.max(0,i-1)];renderContent();return}if(key==='0'){e.preventDefault();S.fontSize=14;renderContent();return}}if(mod&&key==='z'&&S.undo&&['memory','memoryDetail'].includes(S.page)){e.preventDefault();A.undoAction();return}if(S.page==='recapDetail'&&!input){if(['ArrowLeft','PageUp'].includes(key)){e.preventDefault();A.slide(-1);return}if(['ArrowRight','PageDown',' '].includes(key)){e.preventDefault();A.slide(1);return}if(key==='Home'){e.preventDefault();A.goSlide(0);return}if(key==='End'){e.preventDefault();A.goSlide(4);return}}if(input){if(key==='Escape')e.target.blur();return}if(S.page==='sessions'&&key==='m'){S.debugEmpty=!S.debugEmpty;renderContent();return}if(S.page==='memoryDetail'){if(key==='Escape'){e.preventDefault();A.backMemory();return}if(key==='d'){e.preventDefault();A.archive(S.detail);return}}if(S.page==='memory'){if(key==='j'||key==='ArrowDown'){e.preventDefault();A.moveMemory(1,e.shiftKey);return}if(key==='k'||key==='ArrowUp'){e.preventDefault();A.moveMemory(-1,e.shiftKey);return}if(key==='Enter'&&S.cursor){e.preventDefault();A.openCursor();return}if(key==='x'&&S.cursor){e.preventDefault();A.select(S.cursor);return}if(key==='d'){e.preventDefault();A.archive(S.selected.size?[...S.selected]:(S.cursor?[S.cursor]:[]));return}if(key==='u'&&S.undo){e.preventDefault();A.undoAction();return}}if(key==='/'&&['sessions','memory'].includes(S.page)){e.preventDefault();$('#search')?.focus();return}if(key==='s'&&['sessions','memory'].includes(S.page)){e.preventDefault();A.sort();return}if(key==='Escape'&&['sessions','memory'].includes(S.page)){if(S.selected.size){S.selected.clear();renderContent()}else if(S.q){S.q='';renderToolbar();renderContent()}}});
render();
</script>
</body>
</html>
